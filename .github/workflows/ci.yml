name: CI Notes App

on:
  push:
    branches: [ sesi31-loadtest, main ]
  pull_request:
    branches: [ sesi31-loadtest, main ]

jobs:
  # 1. Job Lint
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  # 2. Job Unit Test
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests
        run: npm test -- --coverage
      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: coverage/

  # 3. Job SonarQube Scan
  sonarqube:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # 4. Job k6 Smoke Test
  k6_test:
    needs: sonarqube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Local Server for Testing
        run: |
          npm ci
          npm start &
          sleep 5 # Menunggu server siap
      - name: Run k6 Smoke Test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: loadtest/script.js # Sesuaikan path file k6
